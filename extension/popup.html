<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClipGrab</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt="" width="28" height="28">ClipGrab</h1>
  <form id="form" novalidate>
    <input type="url" id="link" placeholder="Paste an X, Twitch or Streamable link" aria-label="Link" autocomplete="off" spellcheck="false">
    <div id="preview" hidden><p id="platform"></p><p id="title"></p></div>
    <div class="times">
      <label>Start <input id="start" placeholder="0:00" autocomplete="off"></label>
      <label>End <input id="end" placeholder="End" autocomplete="off"></label>
    </div>
    <button type="submit" id="submit">Download video</button>
    <p id="message" aria-live="polite"></p>
  </form>
  <a href="https://clip-grab.vercel.app" target="_blank">Open ClipGrab on the web</a>
</body>
</html>
