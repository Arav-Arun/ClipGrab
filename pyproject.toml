[project]
name = "clipgrab"
version = "3.0.0"
description = "Clip and download videos from X, Twitch and Streamable."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.42",
    "yt-dlp>=2026.10.26",
    "imageio-ffmpeg>=0.6",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

# Vercel deploys this FastAPI app as a single function; public/ is served from the CDN.
[tool.vercel]
entrypoint = "server.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
