[project]
name = "clipgrab"
version = "2.0.0"
description = "Clip and download videos and photos from almost any link."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.42",
    "yt-dlp[default,curl-cffi]>=2026.3.17",
    "imageio-ffmpeg>=0.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

# Vercel deploys this FastAPI app as a single function; public/ is served from the CDN.
[tool.vercel]
entrypoint = "server.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
